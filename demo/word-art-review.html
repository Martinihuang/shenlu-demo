<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>神籙｜國名字圖候選</title><style>
*{box-sizing:border-box}body{margin:0;background:#101d24;color:#f8ecd4;font:17px/1.7 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:24px}header{display:flex;gap:20px;align-items:center;justify-content:space-between}h1{font-size:26px;margin:0}select,button,a{font:inherit;color:inherit;background:#20343c;padding:10px;border:1px solid #9c8657;border-radius:6px}p{color:#c5cec9}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.cell{padding:18px;background:#09141b;border:1px solid #7b6945;border-radius:8px;text-align:center}.sample{height:110px;display:flex;align-items:center;justify-content:center}.country-word{width:100%;height:100%;overflow:hidden}.reference{font-size:16px;color:#d8d3c5}.light .cell{background:#d7d3c7}.light .reference{color:#17272d}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sample{height:85px}header{align-items:flex-start;flex-wrap:wrap}}
</style><main><header><h1>九國繪製字圖・候選對照</h1><label>字圖語系 <select id="locale"><option value="zh-Hant">繁中・原字圖</option><option value="en" selected>English・候選</option><option value="ja">日本語・候選</option><option value="ko">한국어・候選</option><option value="zh-Hans">简体中文・候選</option></select></label><button id="background">切換對比底色</button></header><p>只比較九國字圖，不代表完整遊戲語系已完成。新圖尚未經 Martin 美感驗收；日／韓／簡中字形仍須母語覆核。繪製字圖採內建 ImageGen，正文與效果文字仍使用語言包。</p><div class="grid" id="grid"></div><p><a href="../index.html">返回 Demo</a></p></main><script src="word-art-display.js"></script><script>
(async()=>{const data=await fetch('word-art.json').then(r=>r.json()),ids=['TW','EG','NO','CN','JP','KR','TH','IN','VA'];const chooser=document.getElementById('locale');async function render(){const locale=chooser.value,names=await fetch('../locales/'+locale+'/country-names.json').then(r=>r.json()),grid=document.getElementById('grid');grid.replaceChildren();for(const id of ids){const cell=document.createElement('section');cell.className='cell';const sample=document.createElement('div');sample.className='sample';ShenluWordArt.mount(sample,data,locale,id,names.names[id]);const reference=document.createElement('div');reference.className='reference';reference.textContent=names.names[id];cell.append(sample,reference);grid.append(cell);}}chooser.onchange=render;document.getElementById('background').onclick=()=>document.body.classList.toggle('light');await render();})();
</script></html>
